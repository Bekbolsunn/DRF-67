services:
  web:
    build:
      context: .
    container_name: shop_web
    command: sh /app/entrypoint.sh
    expose:
      - 8000
    env_file: .env
    volumes:
      - .:/app
      - back_media:/app/media
      - back_static:/app/static
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:14
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    container_name: shop_postgres
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: shop_redis
    volumes:
      - redis-data:/data

  celery_worker:
    build:
      context: .
    container_name: shop_worker
    command: celery -A shop_api worker --loglevel=INFO
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .:/app

  celery_beat:
    build:
      context: .
    container_name: shop_beat
    command: celery -A shop_api beat --loglevel=INFO
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .:/app

  celery_flower:
    build:
      context: .
    container_name: shop_flower
    command: celery -A shop_api flower --port=5555
    ports:
      - "5556:5555"
    env_file: .env
    depends_on:
      - redis
    volumes:
      - .:/app

  nginx:
    container_name: shop_ngninx
    image: nginx:1
    ports:
      - "80:80"
    depends_on:
      - web
    volumes:
      - back_media:/media
      - back_static:/static
      - ./nginx.conf:/etc/nginx/conf.d/default.conf


volumes:
  db-data:
  redis-data:
  back_media:
  back_static:
